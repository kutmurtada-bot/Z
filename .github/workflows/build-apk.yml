name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare files
        run: |
          [ -f "index (1).html" ] && cp "index (1).html" index.html || true
          [ -f "package (1).json" ] && cp "package (1).json" package.json || true
          mkdir -p www assets
          cp index.html www/index.html
          cp icon-only.png assets/icon-only.png

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Generate app icons
        continue-on-error: true
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#0f9d78' --iconBackgroundColorDark '#0b8266'

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: flour-app-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: APK v${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
